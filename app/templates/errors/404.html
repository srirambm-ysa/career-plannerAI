{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-16">
    <div class="text-6xl font-bold text-slate-200 mb-4">404</div>
    <h1 class="text-2xl font-bold text-slate-900">Page not found</h1>
    <p class="text-sm text-slate-500 mt-2">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="inline-block mt-6 px-5 py-2.5 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 transition-colors">Go Home</a>
</div>
{% endblock %}
