{% extends "base.html" %}
{% block title %}Step 1 of 4 -- Industry & Country{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    {% include "assessment/_steps.html" %}

    <div class="bg-white rounded-xl border border-slate-200 p-8 mt-8">
        <h2 class="text-2xl font-bold text-slate-900">Select candidate details</h2>
        <p class="text-sm text-slate-500 mt-1">Choose the industry and country that best match the candidate's role.</p>

        <form method="POST" class="mt-6 space-y-5">
            <div>
                <label for="industry" class="block text-sm font-medium text-slate-700 mb-1">Industry</label>
                <select id="industry" name="industry" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                    <option value="">-- Select an industry --</option>
                    {% for ind in industries %}
                    <option value="{{ ind }}" {% if assessment.industry == ind or (not assessment.industry and current_user.last_industry == ind) %}selected{% endif %}>{{ ind }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="country" class="block text-sm font-medium text-slate-700 mb-1">Country</label>
                <select id="country" name="country" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                    <option value="">-- Select a country --</option>
                    {% for c in countries %}
                    <option value="{{ c }}" {% if assessment.country == c or (not assessment.country and current_user.last_country == c) %}selected{% elif not assessment.country and not current_user.last_country and c == 'US' %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit"
                    class="w-full mt-2 px-4 py-3 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                Continue to Profile & Tasks
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
            </button>
        </form>
    </div>
</div>
{% endblock %}
